name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Tickless.slnx

      - name: Build
        run: dotnet build Tickless.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Tickless.slnx -c Release --no-build --verbosity normal
