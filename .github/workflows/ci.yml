name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Tickless.slnx

      - name: Build
        run: dotnet build Tickless.slnx -c Release --no-restore

      - name: Test
        # A zone far from UTC with a 45-minute offset, so DateTime.Kind handling is really exercised.
        env:
          TZ: Pacific/Chatham
        run: dotnet test Tickless.slnx -c Release --no-build --verbosity normal

      - name: Pack (API compatibility check against the published 1.0.0)
        run: dotnet pack src/Tickless/Tickless.csproj -c Release --no-build -o ./artifacts
