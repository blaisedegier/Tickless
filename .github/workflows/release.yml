name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # lets NuGet/login exchange GitHub's OIDC token for a short-lived nuget.org key

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Derive version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore Tickless.slnx

      - name: Test (gate)
        run: dotnet test Tickless.slnx -c Release --verbosity normal

      - name: Pack
        run: dotnet pack src/Tickless/Tickless.csproj -c Release /p:Version=${{ steps.version.outputs.value }} -o ./artifacts

      # Trusted Publishing: no stored API key. nuget.org issues a key valid for about an hour,
      # only to this repository's release.yml, as configured in the package's trusted publishing policy.
      - name: Log in to nuget.org
        id: login
        uses: NuGet/login@v1
        with:
          user: blaise.degier

      - name: Push to NuGet
        run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
